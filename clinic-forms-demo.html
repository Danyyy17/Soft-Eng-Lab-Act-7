<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Management System - River Valley Eye Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#1b2430;--mute:#55606e;--line:#c5ccd6;--brand:#0f5c8a;--err:#b42318;--ok:#1a7f4b;--warn:#8a5a00}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:16px 24px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:14px;opacity:.9}
main{max-width:980px;margin:0 auto;padding:16px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
nav button{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font:inherit}
nav button[aria-current="page"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.tag{font-size:12px;color:var(--mute);margin-left:6px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
h2{margin:0 0 4px;font-size:18px}h3{margin:20px 0 8px;font-size:16px}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px}
.fld{display:flex;flex-direction:column;gap:4px}
label,legend{font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:8px 10px;border:1px solid #7b8794;border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
input[type=file]{font:inherit}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--err);border-width:2px}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.opt{display:flex;align-items:center;gap:6px;font-weight:400}
.help{font-size:13px;color:var(--mute)}
.err{font-size:13px;color:var(--err);font-weight:600}
.span2{grid-column:1/-1}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;cursor:pointer}
.btn.sec{background:#fff;color:var(--brand)}
.btn.warn{background:#fff;color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:3px 10px;font-size:13px}
.summary{border:2px solid var(--err);background:#fdecea;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.summary ul{margin:6px 0 0 18px;padding:0}
.ok{border:2px solid var(--ok);background:#e8f6ee;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.dup{border:2px solid var(--warn);background:#fff6e0;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.sw{display:flex;align-items:center;gap:10px}
.sw input{width:42px;height:22px;accent-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{background:#eef2f6}
.low{color:var(--err);font-weight:700}
.tablewrap{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>Clinic Management System - River Valley Eye Center</h1>
</header>
<main><div id="root"></div></main>

<script type="text/babel">
const {useState, useEffect} = React;
const today = () => new Date().toISOString().slice(0,10);

function usePersisted(key, initial) {
  const [val, setVal] = useState(() => {
    try {
      const s = localStorage.getItem(key);
      return s ? JSON.parse(s) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }, [key, val]);
  return [val, setVal];
}
const nextId = list => list.reduce((m, x) => Math.max(m, x.id), 0) + 1;
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtTime = mins => String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');

function useForm(initial) {
  const [v, setV] = useState(initial);
  const [e, setE] = useState({});
  const set = (n, val) => {
    setV(p => ({ ...p, [n]: val }));
    if (e[n]) setE(p => ({ ...p, [n]: '' }));
  };
  const setMany = (obj) => {
    setV(p => ({ ...p, ...obj }));
    setE(p => {
      const next = { ...p };
      Object.keys(obj).forEach(k => { if (next[k]) next[k] = ''; });
      return next;
    });
  };
  const reset = () => { setV(initial); setE({}); };
  return { v, e, setE, set, setMany, reset };
}

const describe = (n, f, help) => [help ? n + '-help' : null, f.e[n] ? n + '-err' : null].filter(Boolean).join(' ') || undefined;
const Req = () => <span aria-hidden="true" style={{ color: '#b42318' }}> *</span>;
const Msgs = ({ n, f, help }) => <>
  {help && <div id={n + '-help'} className="help">{help}</div>}
  {f.e[n] && <div id={n + '-err'} className="err" role="alert">{Array.isArray(f.e[n]) ? f.e[n][0] : f.e[n]}</div>}
</>;

function TextField({ f, name, label, type = 'text', req, help, span, ...rest }) {
  return <div className={'fld' + (span ? ' span2' : '')}>
    <label htmlFor={name}>{label}{req && <Req />}</label>
    <input id={name} name={name} type={type} value={f.v[name] || ''}
      onChange={ev => f.set(name, ev.target.value)}
      aria-required={req || undefined} aria-invalid={!!f.e[name]}
      aria-describedby={describe(name, f, help)} {...rest} />
    <Msgs n={name} f={f} help={help} />
  </div>;
}

function SelectField({ f, name, label, options, req, help, placeholder = 'Select an option', onChange }) {
  return <div className="fld">
    <label htmlFor={name}>{label}{req && <Req />}</label>
    <select id={name} name={name} value={String(f.v[name] ?? '')}
      onChange={ev => onChange ? onChange(ev.target.value) : f.set(name, ev.target.value)}
      aria-required={req || undefined} aria-invalid={!!f.e[name]}
      aria-describedby={describe(name, f, help)}>
      <option value="">{placeholder}</option>
      {options.map(o => <option key={o.value ?? o} value={o.value ?? o}>{o.label ?? o}</option>)}
    </select>
    <Msgs n={name} f={f} help={help} />
  </div>;
}

function TextArea({ f, name, label, req, help, maxLength = 250, placeholder }) {
  return <div className="fld span2">
    <label htmlFor={name}>{label}{req && <Req />}</label>
    <textarea id={name} name={name} rows={3} maxLength={maxLength} placeholder={placeholder}
      value={f.v[name] || ''} onChange={ev => f.set(name, ev.target.value)}
      aria-required={req || undefined} aria-invalid={!!f.e[name]} aria-describedby={describe(name, f, help)} />
    <div className="help">{(f.v[name] || '').length}/{maxLength} characters</div>
    <Msgs n={name} f={f} help={help} />
  </div>;
}

function RadioGroup({ f, name, legend, options, req, help }) {
  return <fieldset aria-describedby={describe(name, f, help)} aria-required={req || undefined}>
    <legend>{legend}{req && <Req />}</legend>
    <div className="opts">
      {options.map((o, i) => {
        const val = o.value ?? o;
        const lbl = o.label ?? o;
        return (
          <label className="opt" key={val} htmlFor={name + '-' + i}>
            <input type="radio" id={name + '-' + i} name={name} value={val} checked={f.v[name] === val}
              onChange={() => f.set(name, val)} />{lbl}
          </label>);
      })}
    </div>
    <Msgs n={name} f={f} help={help} />
  </fieldset>;
}

function CheckGroup({ f, name, legend, options, help }) {
  const toggle = o => {
    const arr = f.v[name] || [];
    const val = o.value ?? o;
    f.set(name, arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val]);
  };
  return <fieldset aria-describedby={describe(name, f, help)}>
    <legend>{legend}</legend>
    <div className="opts">
      {options.map((o, i) => {
        const val = o.value ?? o;
        const lbl = o.label ?? o;
        const checked = (f.v[name] || []).includes(val);
        return (
          <label className="opt" key={val} htmlFor={name + '-' + i}>
            <input type="checkbox" id={name + '-' + i} name={name} checked={checked} onChange={() => toggle(o)} />{lbl}
          </label>);
      })}
    </div>
    <Msgs n={name} f={f} help={help} />
  </fieldset>;
}

function Switch({ f, name, label, help }) {
  return <div className="fld">
    <div className="sw">
      <input type="checkbox" role="switch" id={name} name={name} checked={!!f.v[name]}
        onChange={ev => f.set(name, ev.target.checked)} aria-checked={!!f.v[name]} aria-describedby={describe(name, f, help)} />
      <label htmlFor={name}>{label}: <strong>{f.v[name] ? 'On' : 'Off'}</strong></label>
    </div>
    <Msgs n={name} f={f} help={help} />
  </div>;
}

function Slider({ f, name, label, min, max, step, unit, help }) {
  return <div className="fld">
    <label htmlFor={name}>{label}: <output htmlFor={name}>{f.v[name]} {unit}</output></label>
    <input type="range" id={name} name={name} min={min} max={max} step={step} value={f.v[name] || min}
      onChange={ev => f.set(name, Number(ev.target.value))} aria-valuetext={f.v[name] + ' ' + unit} aria-describedby={describe(name, f, help)} />
    <Msgs n={name} f={f} help={help} />
  </div>;
}

function FileField({ f, name, label, help, req }) {
  return <div className="fld">
    <label htmlFor={name}>{label}{req && <Req />}</label>
    <input type="file" id={name} name={name} accept=".pdf,.jpg,.jpeg,.png"
      onChange={ev => f.set(name, ev.target.files[0] || null)} aria-invalid={!!f.e[name]}
      aria-required={req || undefined} aria-describedby={describe(name, f, help)} />
    <Msgs n={name} f={f} help={help} />
  </div>;
}

function Summary({ errors }) {
  const items = Object.values(errors).flat().filter(Boolean);
  if (!items.length) return null;
  return <div className="summary" role="alert" tabIndex={-1} id="error-summary">
    <strong>Please fix {items.length} {items.length === 1 ? 'problem' : 'problems'} before submitting:</strong>
    <ul>{items.map((m, i) => <li key={i}>{m}</li>)}</ul>
  </div>;
}

function checkFile(file) {
  if (!file) return '';
  if (!/\.(pdf|jpe?g|png)$/i.test(file.name)) return 'File must be a PDF, JPG, or PNG.';
  if (file.size > 2 * 1024 * 1024) return 'File must be 2 MB or smaller.';
  return '';
}

const patientInit = { last_name: '', first_name: '', birthdate: '', sex: '', civil_status: '', email: '', mobile: '', address: '', is_philhealth_member: false, philhealth_no: '', valid_id: null, consent: false };

function validatePatient(v) {
  const e = {};
  if (!v.last_name.trim()) e.last_name = 'Last name is required.';
  if (!v.first_name.trim()) e.first_name = 'First name is required.';
  if (!v.birthdate) e.birthdate = 'Birthdate is required.';
  else if (v.birthdate > today()) e.birthdate = 'Birthdate cannot be in the future.';
  if (!v.sex) e.sex = 'Select the patient\'s sex.';
  if (!v.civil_status) e.civil_status = 'Select a civil status.';
  if (v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) e.email = 'Enter a valid email address.';
  if (!v.mobile) e.mobile = 'Mobile number is required.';
  else if (!/^09\d{9}$/.test(v.mobile)) e.mobile = 'Mobile number must be 11 digits starting with 09.';
  if (!v.address.trim()) e.address = 'Home address is required.';
  if (v.is_philhealth_member && !/^\d{12}$/.test(v.philhealth_no || '')) e.philhealth_no = 'PhilHealth number must be exactly 12 digits.';
  const fileErr = checkFile(v.valid_id);
  if (fileErr) e.valid_id = fileErr;
  if (!v.consent) e.consent = 'Patient consent is required.';
  return e;
}

function PatientForm({ patients, setPatients }) {
  const f = useForm(patientInit);
  const [msg, setMsg] = useState(null), [dup, setDup] = useState(null);
  const [formKey, setFormKey] = useState(0);

  const clearAll = () => { f.reset(); setDup(null); setFormKey(k => k + 1); };

  const submit = (ev, force = false) => {
    if (ev) ev.preventDefault();
    setMsg(null); setDup(null);

    const errs = validatePatient(f.v);
    if (Object.keys(errs).length) { f.setE(errs); return; }
    f.setE({});

    const match = patients.find(p =>
      p.last_name.trim().toLowerCase() === f.v.last_name.trim().toLowerCase() &&
      p.first_name.trim().toLowerCase() === f.v.first_name.trim().toLowerCase() &&
      p.birthdate === f.v.birthdate);
    if (match && !force) { setDup(match); return; }

    const { valid_id, ...rest } = f.v;
    const record = {
      ...rest,
      last_name: rest.last_name.trim(),
      first_name: rest.first_name.trim(),
      philhealth_no: rest.is_philhealth_member ? rest.philhealth_no : '',
      valid_id_name: valid_id ? valid_id.name : '',
      id: nextId(patients),
    };
    setPatients([record, ...patients]);
    setMsg(`Patient ${record.first_name} ${record.last_name} registered successfully with ID ${record.id}.`);
    clearAll();
  };

  return <section className="card" aria-labelledby="pf-h">
    <h2 id="pf-h">Patient registration</h2>
    <p className="sub">Fields marked * are required. </p>
    {msg && <div className="ok" role="status">{msg}</div>}
    <form key={formKey} onSubmit={submit} noValidate>
      <Summary errors={f.e} />
      {dup && <div className="dup" role="alert">
        <strong>Possible duplicate patient:</strong> {dup.first_name} {dup.last_name} (born {dup.birthdate}) is already registered as Patient ID #{dup.id}.
        <div className="actions">
          <button type="button" className="btn sec" onClick={clearAll}>Use existing record</button>
          <button type="button" className="btn warn" onClick={() => submit(null, true)}>Register as new patient anyway</button>
        </div>
      </div>}
      <div className="grid">
        <TextField f={f} name="last_name" label="Last name" req placeholder="e.g. Dela Cruz" maxLength={50} />
        <TextField f={f} name="first_name" label="First name" req placeholder="e.g. Maria" maxLength={50} />
        <TextField f={f} name="birthdate" type="date" label="Birthdate" req max={today()} />
        <RadioGroup f={f} name="sex" legend="Sex" req options={['Female', 'Male']} />
        <SelectField f={f} name="civil_status" label="Civil status" req options={['Single', 'Married', 'Widowed', 'Separated']} />
        <TextField f={f} name="email" type="email" label="Email (optional)" placeholder="name@example.com" />
        <TextField f={f} name="mobile" type="tel" label="Mobile number" req placeholder="09171234567" help="11 digits starting with 09." maxLength={11} />
        <TextArea f={f} name="address" label="Home address" req placeholder="House no., street, barangay, city" maxLength={200} />
        <Switch f={f} name="is_philhealth_member" label="PhilHealth member" />
        {f.v.is_philhealth_member && <TextField f={f} name="philhealth_no" label="PhilHealth number" req placeholder="12 digits" maxLength={12} />}
        <FileField f={f} name="valid_id" label="Valid ID (optional)" help="PDF, JPG, or PNG up to 2 MB. Only the file name is saved." />
        <div className="fld span2">
          <label className="opt" htmlFor="consent">
            <input type="checkbox" id="consent" name="consent" checked={!!f.v.consent} onChange={ev => f.set('consent', ev.target.checked)} />
            I confirm the patient consents to data collection under RA 10173.<Req />
          </label>
          <Msgs n="consent" f={f} />
        </div>
      </div>
      <div className="actions">
        <button type="submit" className="btn">Register patient</button>
        <button type="button" className="btn sec" onClick={clearAll}>Clear patient form</button>
      </div>
    </form>

    {patients.length > 0 && <div className="tablewrap">
      <h3>Registered patients ({patients.length})</h3>
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Birthdate</th><th>Mobile</th></tr></thead>
        <tbody>
          {patients.map(p => <tr key={p.id}><td>{p.id}</td><td>{p.first_name} {p.last_name}</td><td>{p.birthdate}</td><td>{p.mobile}</td></tr>)}
        </tbody>
      </table>
    </div>}
  </section>;
}

const apptInit = { patient_id: '', provider_id: '', procedure_id: '', date: '', time: '', room_id: '', equipment: [], duration: 30, send_notice: true, notes: '', status: 'Scheduled' };

const PROVIDERS = [{ value: '1', label: 'Dr. Reyes (Ophthalmology)' }, { value: '2', label: 'Dr. Santos (Orthopedics)' }, { value: '3', label: 'Dr. Lim (Gastroenterology)' }];
const PROCS = [{ value: '1', label: 'Cataract surgery', mins: 90 }, { value: '2', label: 'Eye consultation', mins: 30 }, { value: '3', label: 'Colonoscopy', mins: 60 }];
const ROOMS = [{ value: '1', label: 'Consultation Room 1' }, { value: '2', label: 'Operating Room 1' }];
const EQUIP = [{ value: '1', label: 'Slit lamp' }, { value: '2', label: 'Phaco machine' }];
const labelOf = (list, val) => (list.find(x => x.value === String(val)) || {}).label || '';

const OPEN_MIN = 8 * 60, CLOSE_MIN = 17 * 60;

function validateAppt(v, appts) {
  const e = {};
  if (!v.patient_id) e.patient_id = 'Select a patient.';
  if (!v.provider_id) e.provider_id = 'Select a healthcare provider.';
  if (!v.procedure_id) e.procedure_id = 'Select a procedure.';
  if (!v.date) e.date = 'Date is required.';
  else if (v.date < today()) e.date = 'Date cannot be in the past.';
  if (!v.room_id) e.room_id = 'Select a room.';
  if (!v.time) e.time = 'Start time is required.';
  else {
    const start = toMin(v.time), end = start + Number(v.duration);
    if (start < OPEN_MIN || end > CLOSE_MIN) {
      e.time = 'The appointment must fit within clinic hours (08:00 to 17:00).';
    } else if (v.date && v.provider_id && v.room_id) {
      const clash = appts.find(a => a.date === v.date && a.status !== 'Cancelled' &&
        (a.provider_id === v.provider_id || a.room_id === v.room_id) &&
        start < a.end && a.start < end);
      if (clash) {
        const what = clash.provider_id === v.provider_id ? 'The provider is' : 'The room is';
        e.time = `${what} already booked ${fmtTime(clash.start)}-${fmtTime(clash.end)} (appointment #${clash.id}).`;
      }
    }
  }
  return e;
}

function AppointmentForm({ patients, appts, setAppts }) {
  const f = useForm(apptInit);
  const [msg, setMsg] = useState(null);

  const pickProc = val => {
    const p = PROCS.find(x => x.value === String(val));
    f.setMany(p ? { procedure_id: String(val), duration: p.mins } : { procedure_id: String(val) });
  };

  const submit = (ev) => {
    ev.preventDefault(); setMsg(null);
    const errs = validateAppt(f.v, appts);
    if (Object.keys(errs).length) { f.setE(errs); return; }

    const patient = patients.find(p => String(p.id) === String(f.v.patient_id));
    const start = toMin(f.v.time);
    const record = {
      ...f.v,
      id: nextId(appts),
      patient_name: patient ? `${patient.first_name} ${patient.last_name}` : '',
      duration: Number(f.v.duration),
      start,
      end: start + Number(f.v.duration),
    };
    setAppts([record, ...appts]);
    setMsg(`Appointment #${record.id} scheduled successfully.`);
    f.reset();
  };

  const setStatus = (id, status) => setAppts(appts.map(a => a.id === id ? { ...a, status } : a));

  return <section className="card" aria-labelledby="af-h">
    <h2 id="af-h">Book appointment</h2>
    <p className="sub">Double-booking of the same provider or room is blocked.</p>
    {msg && <div className="ok" role="status">{msg}</div>}
    {!patients.length && <div className="dup" role="status">No patients yet. Register a patient first, then come back to book an appointment.</div>}
    <form onSubmit={submit} noValidate>
      <Summary errors={f.e} />
      <div className="grid">
        <SelectField f={f} name="patient_id" label="Patient" req options={patients.map(p => ({ value: p.id, label: `${p.first_name} ${p.last_name} (#${p.id})` }))} />
        <SelectField f={f} name="provider_id" label="Healthcare provider" req options={PROVIDERS} />
        <SelectField f={f} name="procedure_id" label="Procedure" req options={PROCS} onChange={pickProc} />
        <TextField f={f} name="date" type="date" label="Date" req min={today()} />
        <TextField f={f} name="time" type="time" label="Start time" req help="Clinic hours: 08:00 to 17:00." />
        <RadioGroup f={f} name="room_id" legend="Room" req options={ROOMS} />
        <CheckGroup f={f} name="equipment" legend="Equipment needed" options={EQUIP} />
        <Slider f={f} name="duration" label="Duration" min={15} max={180} step={15} unit="minutes" />
        <Switch f={f} name="send_notice" label="Send appointment notice" />
        <TextArea f={f} name="notes" label="Notes (optional)" />
      </div>
      <div className="actions">
        <button type="submit" className="btn">Confirm appointment</button>
        <button type="button" className="btn sec" onClick={() => f.reset()}>Clear appointment form</button>
      </div>
    </form>

    {appts.length > 0 && <div className="tablewrap">
      <h3>Booked appointments ({appts.length})</h3>
      <table>
        <thead><tr><th>ID</th><th>Patient</th><th>Provider</th><th>Procedure</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          {appts.map(a => <tr key={a.id}>
            <td>{a.id}</td><td>{a.patient_name}</td><td>{labelOf(PROVIDERS, a.provider_id)}</td>
            <td>{labelOf(PROCS, a.procedure_id)}</td><td>{a.date}</td><td>{fmtTime(a.start)}-{fmtTime(a.end)}</td><td>{a.status}</td>
            <td>{a.status === 'Scheduled' && <>
              <button type="button" className="btn sec sm" onClick={() => setStatus(a.id, 'Completed')}>Complete</button>{' '}
              <button type="button" className="btn warn sm" onClick={() => setStatus(a.id, 'Cancelled')}>Cancel</button>
            </>}</td>
          </tr>)}
        </tbody>
      </table>
    </div>}
  </section>;
}

const invInit = { item_id: '', type: '', quantity: '', unit: '', supplier: '', transaction_date: today(), expiry_date: '', unit_cost: '', reorder_point: 20, urgent: false, receipt: null, remarks: '' };
const ITEMS = [{ value: '1', label: 'Intraocular lens' }, { value: '2', label: 'Surgical gloves' }];

const stockOf = (txns, itemId) => txns.filter(t => t.item_id === String(itemId))
  .reduce((sum, t) => sum + (t.type === 'Stock in' ? t.quantity : -t.quantity), 0);

function validateInv(v, txns) {
  const e = {};
  if (!v.item_id) e.item_id = 'Select an item.';
  if (!v.type) e.type = 'Select a transaction type.';
  const q = Number(v.quantity);
  if (!v.quantity) e.quantity = 'Quantity is required.';
  else if (!Number.isInteger(q) || q < 1 || q > 5000) e.quantity = 'Quantity must be a whole number from 1 to 5000.';
  if (!v.unit) e.unit = 'Select a unit.';
  if (!v.transaction_date) e.transaction_date = 'Transaction date is required.';
  else if (v.transaction_date > today()) e.transaction_date = 'Transaction date cannot be in the future.';
  if (v.type === 'Stock in') {
    if (!v.supplier.trim()) e.supplier = 'Supplier is required for stock in.';
    if (v.unit_cost === '' || Number(v.unit_cost) < 0) e.unit_cost = 'Enter a unit cost of 0 or more.';
    if (v.expiry_date && v.transaction_date && v.expiry_date <= v.transaction_date) e.expiry_date = 'Expiry date must be after the transaction date.';
  }
  if (v.type === 'Stock out' && v.item_id && !e.quantity) {
    const have = stockOf(txns, v.item_id);
    if (q > have) e.quantity = `Not enough stock. Only ${have} available.`;
  }
  const fileErr = checkFile(v.receipt);
  if (fileErr) e.receipt = fileErr;
  return e;
}

function InventoryForm({ txns, setTxns }) {
  const f = useForm(invInit);
  const [msg, setMsg] = useState(null);
  const [formKey, setFormKey] = useState(0);

  const submit = (ev) => {
    ev.preventDefault(); setMsg(null);
    const errs = validateInv(f.v, txns);
    if (Object.keys(errs).length) { f.setE(errs); return; }
    const { receipt, ...rest } = f.v;
    const isIn = rest.type === 'Stock in';
    const record = {
      ...rest,
      quantity: Number(rest.quantity),
      supplier: isIn ? rest.supplier.trim() : '',
      expiry_date: isIn ? rest.expiry_date : '',
      unit_cost: isIn ? Number(rest.unit_cost) : '',
      receipt_name: receipt ? receipt.name : '',
      id: nextId(txns),
    };
    setTxns([record, ...txns]);
    setMsg('Inventory transaction recorded successfully.');
    f.reset(); setFormKey(k => k + 1);
  };

  return <section className="card" aria-labelledby="if-h">
    <h2 id="if-h">Inventory transaction</h2>
    {msg && <div className="ok" role="status">{msg}</div>}
    <form key={formKey} onSubmit={submit} noValidate>
      <Summary errors={f.e} />
      <div className="grid">
        <SelectField f={f} name="item_id" label="Item" req options={ITEMS} />
        <RadioGroup f={f} name="type" legend="Transaction type" req options={['Stock in', 'Stock out']} />
        <TextField f={f} name="quantity" type="number" label="Quantity" req min="1" max="5000" />
        <SelectField f={f} name="unit" label="Unit" req options={['pcs', 'box', 'vial', 'bottle']} />
        {f.v.type === 'Stock in' && <TextField f={f} name="supplier" label="Supplier" req />}
        <TextField f={f} name="transaction_date" type="date" label="Transaction date" req max={today()} />
        {f.v.type === 'Stock in' && <TextField f={f} name="expiry_date" type="date" label="Expiry date" />}
        {f.v.type === 'Stock in' && <TextField f={f} name="unit_cost" type="number" label="Unit cost (PHP)" req min="0" step="0.01" />}
        <Slider f={f} name="reorder_point" label="Reorder point" min={5} max={100} step={5} unit="units" />
        <Switch f={f} name="urgent" label="Urgent order" />
        <FileField f={f} name="receipt" label="Receipt (optional)" help="Only the file name is saved." />
        <TextArea f={f} name="remarks" label="Remarks (optional)" />
      </div>
      <div className="actions">
        <button type="submit" className="btn">Record transaction</button>
      </div>
    </form>

    <div className="tablewrap">
      <h3>Current stock</h3>
      <table>
        <thead><tr><th>Item</th><th>On hand</th><th>Reorder point</th><th>Status</th></tr></thead>
        <tbody>
          {ITEMS.map(it => {
            const stock = stockOf(txns, it.value);
            const last = txns.find(t => t.item_id === it.value);
            const rp = last ? last.reorder_point : 20;
            const low = stock <= rp;
            return <tr key={it.value}>
              <td>{it.label}</td><td className={low ? 'low' : ''}>{stock}</td><td>{rp}</td>
              <td className={low ? 'low' : ''}>{low ? 'Low stock' : 'OK'}</td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>

    {txns.length > 0 && <div className="tablewrap">
      <h3>Transaction history ({txns.length})</h3>
      <table>
        <thead><tr><th>ID</th><th>Date</th><th>Item</th><th>Type</th><th>Qty</th><th>Unit</th></tr></thead>
        <tbody>
          {txns.map(t => <tr key={t.id}>
            <td>{t.id}</td><td>{t.transaction_date}</td><td>{labelOf(ITEMS, t.item_id)}</td><td>{t.type}</td><td>{t.quantity}</td><td>{t.unit}</td>
          </tr>)}
        </tbody>
      </table>
    </div>}
  </section>;
}

const filtInit = { keyword: '', from: '', to: '', provider_id: '', status: ['Scheduled'], sort: 'asc', per_page: 10 };

function ReportForm({ appts }) {
  const f = useForm(filtInit);
  const [res, setRes] = useState(null);

  const run = (ev) => {
    ev.preventDefault();
    const errs = {};
    if (f.v.from && f.v.to && f.v.from > f.v.to) errs.to = 'To date must be on or after the From date.';
    const pp = Number(f.v.per_page);
    if (!Number.isInteger(pp) || pp < 5 || pp > 100) errs.per_page = 'Rows per page must be between 5 and 100.';
    if (Object.keys(errs).length) { f.setE(errs); return; }
    f.setE({});

    const kw = f.v.keyword.trim().toLowerCase();
    let rows = appts.filter(a =>
      (!kw || a.patient_name.toLowerCase().includes(kw)) &&
      (!f.v.from || a.date >= f.v.from) &&
      (!f.v.to || a.date <= f.v.to) &&
      (!f.v.provider_id || a.provider_id === f.v.provider_id) &&
      (!f.v.status.length || f.v.status.includes(a.status)));
    rows.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    if (f.v.sort === 'desc') rows.reverse();
    setRes({ total: rows.length, rows: rows.slice(0, pp) });
  };

  return <section className="card" aria-labelledby="rf-h">
    <h2 id="rf-h">Report filters</h2>
    <form onSubmit={run} noValidate>
      <Summary errors={f.e} />
      <div className="grid">
        <TextField f={f} name="keyword" label="Search keyword" placeholder="Patient name" />
        <TextField f={f} name="from" type="date" label="From date" />
        <TextField f={f} name="to" type="date" label="To date" />
        <SelectField f={f} name="provider_id" label="Provider" options={PROVIDERS} placeholder="All providers" />
        <CheckGroup f={f} name="status" legend="Status" options={['Scheduled', 'Completed', 'Cancelled']} />
        <RadioGroup f={f} name="sort" legend="Sort order" options={[{ value: 'asc', label: 'Oldest first' }, { value: 'desc', label: 'Newest first' }]} />
        <TextField f={f} name="per_page" type="number" label="Rows per page" min="5" max="100" />
      </div>
      <div className="actions">
        <button type="submit" className="btn">Apply filters</button>
      </div>
    </form>
    {res && <div className="tablewrap">
      <h3>Results ({res.total}{res.total > res.rows.length ? `, showing ${res.rows.length}` : ''})</h3>
      <table>
        <thead><tr><th>ID</th><th>Patient</th><th>Provider</th><th>Date</th><th>Time</th><th>Status</th></tr></thead>
        <tbody>
          {res.rows.map(r => <tr key={r.id}>
            <td>{r.id}</td><td>{r.patient_name}</td><td>{labelOf(PROVIDERS, r.provider_id)}</td>
            <td>{r.date}</td><td>{fmtTime(r.start)}-{fmtTime(r.end)}</td><td>{r.status}</td>
          </tr>)}
          {!res.rows.length && <tr><td colSpan="6">No records found.</td></tr>}
        </tbody>
      </table>
    </div>}
  </section>;
}

function App() {
  const [tab, setTab] = useState(0);
  const [patients, setPatients] = usePersisted('clinic_patients', []);
  const [appts, setAppts] = usePersisted('clinic_appts', []);
  const [txns, setTxns] = usePersisted('clinic_txns', []);

  const tabs = ['Patient registration', 'Appointment', 'Inventory', 'Report filters'];

  return <>
    <nav aria-label="Forms">{tabs.map((t, i) => <button key={t} onClick={() => setTab(i)} aria-current={tab === i ? 'page' : undefined}>{t}</button>)}</nav>
    {tab === 0 && <PatientForm patients={patients} setPatients={setPatients} />}
    {tab === 1 && <AppointmentForm patients={patients} appts={appts} setAppts={setAppts} />}
    {tab === 2 && <InventoryForm txns={txns} setTxns={setTxns} />}
    {tab === 3 && <ReportForm appts={appts} />}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
